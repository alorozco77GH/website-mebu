<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Ratón comiendo chocolate -->
  
  <!-- Cuerpo del ratón -->
  <ellipse cx="200" cy="200" rx="80" ry="90" fill="#B8B8B8"/>
  
  <!-- Orejas -->
  <ellipse cx="150" cy="130" rx="35" ry="45" fill="#A0A0A0"/>
  <ellipse cx="250" cy="130" rx="35" ry="45" fill="#A0A0A0"/>
  <ellipse cx="150" cy="135" rx="20" ry="28" fill="#FFB6C1"/>
  <ellipse cx="250" cy="135" rx="20" ry="28" fill="#FFB6C1"/>
  
  <!-- Cabeza -->
  <circle cx="200" cy="180" r="60" fill="#C0C0C0"/>
  
  <!-- Hocico -->
  <ellipse cx="200" cy="205" rx="35" ry="25" fill="#E8E8E8"/>
  
  <!-- Nariz -->
  <ellipse cx="200" cy="195" rx="8" ry="6" fill="#FFB6C1"/>
  
  <!-- Ojos cerrados (feliz comiendo) -->
  <path d="M 175 170 Q 180 175 185 170" stroke="#404040" stroke-width="3" fill="none"/>
  <path d="M 215 170 Q 220 175 225 170" stroke="#404040" stroke-width="3" fill="none"/>
  
  <!-- Bigotes -->
  <line x1="140" y1="200" x2="100" y2="195" stroke="#606060" stroke-width="2"/>
  <line x1="140" y1="205" x2="100" y2="210" stroke="#606060" stroke-width="2"/>
  <line x1="260" y1="200" x2="300" y2="195" stroke="#606060" stroke-width="2"/>
  <line x1="260" y1="205" x2="300" y2="210" stroke="#606060" stroke-width="2"/>
  
  <!-- Barra de chocolate -->
  <rect x="180" y="220" width="50" height="35" rx="3" fill="#8B4513"/>
  
  <!-- Cuadrados del chocolate -->
  <line x1="205" y1="220" x2="205" y2="255" stroke="#654321" stroke-width="2"/>
  <line x1="180" y1="237" x2="230" y2="237" stroke="#654321" stroke-width="2"/>
  
  <!-- Mordida del chocolate -->
  <ellipse cx="175" cy="225" rx="12" ry="10" fill="#C0C0C0"/>
  
  <!-- Manitas sosteniendo el chocolate -->
  <ellipse cx="170" cy="235" rx="12" ry="8" fill="#B8B8B8"/>
  <ellipse cx="240" cy="235" rx="12" ry="8" fill="#B8B8B8"/>
  
  <!-- Deditos -->
  <circle cx="165" cy="232" r="4" fill="#A8A8A8"/>
  <circle cx="170" cy="230" r="4" fill="#A8A8A8"/>
  <circle cx="235" cy="230" r="4" fill="#A8A8A8"/>
  <circle cx="240" cy="232" r="4" fill="#A8A8A8"/>
  
  <!-- Brillos en el chocolate -->
  <rect x="210" y="223" width="8" height="3" fill="#A0522D" opacity="0.5"/>
  
  <!-- Cola -->
  <path d="M 120 240 Q 100 250 95 270" stroke="#A0A0A0" stroke-width="8" fill="none" stroke-linecap="round"/>
  
  <!-- Patitas -->
  <ellipse cx="170" cy="280" rx="15" ry="10" fill="#B8B8B8"/>
  <ellipse cx="230" cy="280" rx="15" ry="10" fill="#B8B8B8"/>
</svg>

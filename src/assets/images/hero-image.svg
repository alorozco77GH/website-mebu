  <line x1="170" y1="281" x2="170" y2="285" stroke="#777777" stroke-width="1.5"/>
  <line x1="175" y1="282" x2="175" y2="287" stroke="#777777" stroke-width="1.5"/>
  <line x1="180" y1="281" x2="180" y2="285" stroke="#777777" stroke-width="1.5"/>
  <line x1="220" y1="281" x2="220" y2="285" stroke="#777777" stroke-width="1.5"/>
  <line x1="225" y1="282" x2="225" y2="287" stroke="#777777" stroke-width="1.5"/>
  <line x1="230" y1="281" x2="230" y2="285" stroke="#777777" stroke-width="1.5"/>

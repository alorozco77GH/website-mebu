  <circle cx="200" cy="191" r="2.5" fill="white" opacity="0.7"/>
  
  <!-- Ojos expresivos cerrados -->
  <path d="M 177 168 Q 182 172 187 168" stroke="#333333" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 213 168 Q 218 172 223 168" stroke="#333333" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Cejas expresivas -->
  <path d="M 172 158 Q 180 156 188 158" stroke="#555555" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M 212 158 Q 220 156 228 158" stroke="#555555" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  
  <!-- Bigotes definidos -->
  <line x1="145" y1="195" x2="105" y2="190" stroke="#333333" stroke-width="3" stroke-linecap="round"/>
  <line x1="145" y1="202" x2="105" y2="207" stroke="#333333" stroke-width="3" stroke-linecap="round"/>
  <line x1="255" y1="195" x2="295" y2="190" stroke="#333333" stroke-width="3" stroke-linecap="round"/>
  <line x1="255" y1="202" x2="295" y2="207" stroke="#333333" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Barra de chocolate con detalles -->
  <rect x="180" y="220" width="48" height="32" rx="3" fill="#6B3410" stroke="#331a08" stroke-width="3"/>
  <line x1="204" y1="220" x2="204" y2="252" stroke="#331a08" stroke-width="3"/>
  <line x1="180" y1="236" x2="228" y2="236" stroke="#331a08" stroke-width="3"/>
  <!-- Brillos en chocolate -->
  <rect x="208" y="223" width="12" height="3" fill="#8B4513" opacity="0.7"/>
  <rect x="185" y="240" width="8" height="2" fill="#8B4513" opacity="0.5"/>
  
  <!-- Mordida estilo cómic -->
  <path d="M 175 225 Q 168 230 175 235" fill="#AAAAAA" stroke="#333333" stroke-width="2.5"/>
  
  <!-- Manitas sosteniendo -->
  <ellipse cx="172" cy="236" rx="11" ry="7" fill="#999999" stroke="#333333" stroke-width="2.5"/>
  <ellipse cx="235" cy="236" rx="11" ry="7" fill="#999999" stroke="#333333" stroke-width="2.5"/>
  <!-- Dedos definidos -->
  <circle cx="167" cy="233" r="3.5" fill="#888888" stroke="#333333" stroke-width="1"/>
  <circle cx="172" cy="231" r="3.5" fill="#888888" stroke="#333333" stroke-width="1"/>
  <circle cx="230" cy="231" r="3.5" fill="#888888" stroke="#333333" stroke-width="1"/>
  <circle cx="235" cy="233" r="3.5" fill="#888888" stroke="#333333" stroke-width="1"/>
  
  <!-- Cola expresiva -->
  <path d="M 130 245 Q 105 258 98 278" stroke="#999999" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M 130 245 Q 105 258 98 278" stroke="#333333" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.3"/>
  
  <!-- Patitas con detalles -->
  <ellipse cx="175" cy="275" rx="14" ry="8" fill="#999999" stroke="#333333" stroke-width="2.5"/>
  <ellipse cx="225" cy="275" rx="14" ry="8" fill="#999999" stroke="#333333" stroke-width="2.5"/>

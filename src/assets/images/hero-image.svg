<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Ratón estilo cómic comiendo chocolate - Hero -->
  
  <!-- Sombra -->
  <ellipse cx="210" cy="285" rx="75" ry="12" fill="#00000025"/>
  
  <!-- Cuerpo -->
  <ellipse cx="200" cy="205" rx="72" ry="80" fill="#999999" stroke="#333333" stroke-width="4"/>
  
  <!-- Orejas -->
  <ellipse cx="155" cy="135" rx="30" ry="40" fill="#999999" stroke="#333333" stroke-width="4"/>
  <ellipse cx="245" cy="135" rx="30" ry="40" fill="#999999" stroke="#333333" stroke-width="4"/>
  <ellipse cx="155" cy="140" rx="17" ry="24" fill="#FF6B9D"/>
  <ellipse cx="245" cy="140" rx="17" ry="24" fill="#FF6B9D"/>
  
  <!-- Cabeza -->
